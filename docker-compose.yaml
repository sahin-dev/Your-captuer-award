
services:
  
 
  api:
    build: .
    container_name: backend
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5003
    ports:
      - 5003:5003
    command: npm run dev
    restart: unless-stopped

  worker:
    build: .
    container_name: worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: npm run worker
    restart: unless-stopped

volumes:
  mongo-data:
