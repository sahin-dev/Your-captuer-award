apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # "Related metrics" from a trace span jump to the route's latency in Prometheus.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: http.route
            value: http_route
        queries:
          - name: Route p95 latency
            query: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{$$__tags}[5m])))
