global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # App metrics arrive through the collector, not by scraping the app: under
  # PM2 cluster mode a scrape of the app port would hit one random worker.
  - job_name: otel-collector
    honor_labels: true # keep the app's job/instance labels
    static_configs:
      - targets: ["otel-collector:8889"]
